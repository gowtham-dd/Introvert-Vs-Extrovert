# params.yaml
XGBoost:
  max_depth: 4
  eta: 0.01               # ← alias for learning_rate
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_jobs: 2
  #  any extra you’d like…

CatBoost:
  iterations: 1000
  depth: 6
  learning_rate: 0.05
  random_seed: 42
  l2_leaf_reg: 3
  early_stopping_rounds: 50
  verbose: 0

training:
  n_splits: 5
  n_repeats: 1
  ensemble_weights:
    xgb: 0.6
    cat: 0.4
