<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personality Predictor • Introvert vs Extrovert</title>
  <style>
    :root {
      --primary-clr: #6a5acd; /* slate blue */
      --primary-dark: #5948b6;
      --accent-clr: #ffc107;
      --bg: #f4f7ff;
      --card: #ffffff;
      --text: #333;
      --border: #ddd;
    }

    /* ---------- reset / layout ---------- */
    html, body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100%;
    }

    .container {
      max-width: 820px;
      margin: auto;
      padding: 1rem 1.25rem 3rem;
    }

    /* ---------- header ---------- */
    header {
      background: var(--primary-clr);
      color: #fff;
      text-align: center;
      padding: 3rem 1rem 4rem;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(255,255,255,0.15), transparent 60%);
      animation: pulse 6s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 0.9; }
      to   { transform: scale(1.2); opacity: 1; }
    }

    h1 {
      margin: 0;
      font-size: 2.4rem;
      letter-spacing: 0.5px;
      z-index: 2;
      position: relative;
    }

    .subtitle {
      margin-top: 0.5rem;
      font-size: 1.1rem;
      opacity: 0.9;
      z-index: 2;
      position: relative;
    }

    /* ---------- card / form ---------- */
    .card {
      background: var(--card);
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      padding: 2rem 2.5rem;
      position: relative; 
      top: -100px;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card h2 {
      text-align: center;
      color: var(--primary-clr);
      margin-top: 0;
      margin-bottom: 1.3rem;
      font-size: 1.8rem;
    }

    /* flex rows */
    .form-row {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
    }
    .form-group {
      flex: 1 1 260px;
      display: flex;
      flex-direction: column;
      margin-bottom: 1.25rem;
    }

    label {
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    input, select {
      padding: 0.65rem 0.85rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 5px;
      transition: border 0.3s, box-shadow 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary-clr);
      box-shadow: 0 0 0 3px rgba(106,90,205,0.2);
    }

    button {
      background: var(--primary-clr);
      color: #fff;
      border: none;
      width: 100%;
      padding: 0.85rem;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    button:active { transform: translateY(0); }

    @media (max-width: 600px) {
      header { padding: 2.5rem 1rem 3rem; }
      .card { padding: 1.5rem 1.25rem; margin-top: -100px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>Personality Predictor</h1>
      <p class="subtitle">Discover whether you lean Introvert or Extrovert</p>
    </div>
  </header>

  <div class="container">
    <section class="card">
      <h2>Enter Your Behaviour Details</h2>
      <form action="/predict" method="post">
        <div class="form-row">
          <div class="form-group">
            <label for="time_spent_alone">Time Spent Alone (hours/day)</label>
            <input type="number" step="0.1" id="time_spent_alone" name="time_spent_alone" required />
          </div>
          <div class="form-group">
            <label for="social_event_attendance">Social Events Attended (per week)</label>
            <input type="number" step="0.1" id="social_event_attendance" name="social_event_attendance" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="going_outside">Going Outside (1‑10)</label>
            <input type="number" step="0.1" id="going_outside" name="going_outside" required />
          </div>
          <div class="form-group">
            <label for="friends_circle_size">Friends Circle Size</label>
            <input type="number" step="1" id="friends_circle_size" name="friends_circle_size" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="post_frequency">Post Frequency (per week)</label>
            <input type="number" step="1" id="post_frequency" name="post_frequency" required />
          </div>
          <div class="form-group">
            <label for="stage_fear">Stage Fear</label>
            <select id="stage_fear" name="stage_fear" required>
              <option value="" disabled selected>Select</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="drained_after_socializing">Drained After Socializing</label>
            <select id="drained_after_socializing" name="drained_after_socializing" required>
              <option value="" disabled selected>Select</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
          <div class="form-group">
            <label for="p2">Secondary Label P2</label>
            <select id="p2" name="p2">
              <option value="Unknown" selected>Unknown</option>
              <option value="Introvert">Introvert</option>
              <option value="Extrovert">Extrovert</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <button type="submit">Predict Personality</button>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
